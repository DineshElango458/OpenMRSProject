name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Add Maven compiler --add-exports fix (for Lombok issue)
        run: |
          echo "MAVEN_OPTS=--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED" >> $GITHUB_ENV

      - name: Build with Maven
        run: mvn clean test

      # Optional: Dependency graph submission
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v4
